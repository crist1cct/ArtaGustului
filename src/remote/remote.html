<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0c0b0a">
<title>Telecomandă · Arta Gustului</title>
<style>
  :root { --bg:#0c0b0a; --panel:#171512; --line:rgba(243,230,207,.14); --text:#f3e6cf; --muted:#9d9384; --gold:#d8b36e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; padding:24px 16px; gap:22px; }
  header { text-align:center; }
  header p { margin:0; color:var(--gold); font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
  header h1 { margin:6px 0 0; font-weight:500; font-size:24px; }
  svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .transport { display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:14px; align-items:center; }
  button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:22px; height:84px; display:grid; place-items:center; cursor:pointer; }
  button:active { border-color:var(--gold); background:#221e18; }
  .play { height:110px; border-radius:55px; border-color:var(--gold); color:var(--gold); }
  .play svg { width:40px; height:40px; }
  .vol { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .vol-top { display:flex; justify-content:space-between; align-items:baseline; color:var(--muted); }
  .vol-top b { font-size:36px; font-weight:300; color:var(--text); }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:linear-gradient(90deg,var(--gold) var(--p,50%), rgba(255,255,255,.12) var(--p,50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:30px; height:30px; margin-top:-11px; border-radius:50%; background:var(--bg); border:2px solid var(--gold); }
  .vol-btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .vol-btns button { height:60px; border-radius:16px; }
  .sources { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .sources button { height:72px; border-radius:16px; display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  .muted-on { color:#e2735f; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:auto; }
  #err { color:#e2735f; text-align:center; font-size:14px; min-height:18px; }
</style>
</head>
<body>
  <header><p>Arta Gustului</p><h1>Telecomandă muzică</h1></header>

  <div class="transport">
    <button data-a="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M18 6v12L9.5 12Z"/><path d="M6.5 6v12"/></svg></button>
    <button class="play" data-a="playpause" aria-label="Redare / pauză"><svg viewBox="0 0 24 24"><path d="M6 5.5v13l8-6.5Z"/><path d="M16.5 6v12M20 6v12"/></svg></button>
    <button data-a="next" aria-label="Următor"><svg viewBox="0 0 24 24"><path d="M6 6v12l8.5-6Z"/><path d="M17.5 6v12"/></svg></button>
  </div>

  <div class="vol">
    <div class="vol-top"><span>Volum laptop</span><b id="val">–</b></div>
    <input type="range" id="slider" min="0" max="100" step="1">
    <div class="vol-btns">
      <button id="down" aria-label="Mai încet"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button id="mute" aria-label="Fără sunet"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg></button>
      <button id="up" aria-label="Mai tare"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    </div>
  </div>

  <div class="sources">
    <button data-a="spotify"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M7.5 9.6c3-1 6.4-.7 9 .8M8 12.6c2.5-.7 5.1-.4 7.2.8M8.6 15.4c1.9-.5 3.8-.3 5.4.6"/></svg>Spotify</button>
    <button data-a="youtube"><svg viewBox="0 0 24 24"><rect x="2.8" y="5.5" width="18.4" height="13" rx="4"/><path d="m10.2 9.3 4.6 2.7-4.6 2.7Z"/></svg>YouTube</button>
    <button data-a="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>Acasă</button>
  </div>

  <p id="err"></p>
  <footer>Volumul din sală se reglează din butonul VOLUME al sistemului LG.</footer>

<script>
  const k = new URLSearchParams(location.search).get('k');
  const $ = (s) => document.querySelector(s);
  let state = { level: 50, muted: false };
  let t = null;

  async function call(action, value) {
    try {
      const r = await fetch('/api?k=' + encodeURIComponent(k), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, value }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      $('#err').textContent = '';
      if (j.result && typeof j.result.level === 'number') { state = j.result; render(); }
      return j.result;
    } catch (e) { $('#err').textContent = 'Fără legătură cu laptopul. Verifică Wi-Fi-ul.'; }
  }
  function render() {
    $('#val').textContent = state.muted ? 'mut' : state.level + '%';
    if (document.activeElement !== $('#slider')) $('#slider').value = state.level;
    $('#slider').style.setProperty('--p', state.level + '%');
    $('#mute').classList.toggle('muted-on', state.muted);
  }
  function setLevel(v) {
    state.level = Math.max(0, Math.min(100, v)); render();
    clearTimeout(t); t = setTimeout(() => call('volume', state.level), 80);
  }
  document.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { navigator.vibrate && navigator.vibrate(15); call(b.dataset.a); });
  $('#slider').oninput = (e) => setLevel(+e.target.value);
  $('#down').onclick = () => setLevel(state.level - 5);
  $('#up').onclick = () => setLevel(state.level + 5);
  $('#mute').onclick = () => call('mute', !state.muted);
  call('status');
  setInterval(() => call('status'), 5000);
</script>
</body>
</html>
