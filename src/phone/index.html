<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>Arta Gustului · Ospătar</title>
  <link rel="stylesheet" href="/phone.css">
</head>
<body>
  <header class="top">
    <div class="brand"><b>Arta Gustului</b><small id="topSub">Ospătar</small></div>
    <button class="who" id="who"></button>
    <span class="conn" id="conn" title="Legătura cu laptopul"></span>
  </header>
  <main id="screen" class="screen"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="tables"><span data-i="table"></span>Mese</button>
    <button data-tab="checks"><span data-i="receipt"></span>Cecuri</button>
    <button data-tab="calc"><span data-i="calc"></span>Calculator</button>
    <button data-tab="music"><span data-i="music"></span>Muzică</button>
  </nav>
  <section class="order" id="order" hidden></section>
  <div class="sheet-bg" id="sheetBg" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <div class="toast" id="toast" hidden></div>
  <script src="/product-icons.js"></script>
  <script src="/phone.js"></script>
</body>
</html>
